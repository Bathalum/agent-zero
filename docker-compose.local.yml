version: '3.8'

services:
  # Portal Backend (Flask API)
  portal-backend:
    container_name: portal-backend-local
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "${PORTAL_PORT:-5000}:5000"
    environment:
      - TZ=UTC
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-changeme-in-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      - PORT=5000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - AGENT_ZERO_URL=${AGENT_ZERO_URL:-http://agent-zero-local:80}
      - AGENT_ZERO_REQUEST_TIMEOUT=${AGENT_ZERO_REQUEST_TIMEOUT:-10}
    volumes:
      # Development: Mount app code for hot-reload
      - ./app:/app/app
      - ./migrations:/app/migrations
    restart: unless-stopped
    depends_on:
      - agent-zero-local
    networks:
      - agent-zero-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/user/agent-zero-status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Agent Zero Backend
  agent-zero-local:
    container_name: agent-zero-local
    image: agent-zero-local:latest
    build:
      context: .
      dockerfile: DockerfileLocal
      args:
        BRANCH: local
        CACHE_DATE: "${CACHE_DATE:-2025-01-08}"
    
    # Port mappings
    ports:
      - "${WEB_PORT:-8080}:80"      # Web UI
      - "${SSH_PORT:-2222}:22"       # SSH for development
    
    # Volume mappings for persistence
    # WARNING: Mapping full /a0 can cause upgrade issues
    # Consider using backup/restore instead
    volumes:
      # Data directories (persisted)
      - ./agent-zero-data/memory:/a0/memory
      - ./agent-zero-data/knowledge:/a0/knowledge
      - ./agent-zero-data/instruments:/a0/instruments
      - ./agent-zero-data/logs:/a0/logs
      - ./agent-zero-data/tmp:/a0/tmp
      
      # DEVELOPMENT MODE: Source code hot-reload
      # Map local source code to container for instant updates
      - ./python:/a0/python
      - ./agents:/a0/agents
      - ./prompts:/a0/prompts
      - ./webui:/a0/webui
      - ./conf:/a0/conf
      - ./run_ui.py:/a0/run_ui.py
      - ./run_tunnel.py:/a0/run_tunnel.py
      - ./agent.py:/a0/agent.py
      - ./models.py:/a0/models.py
      - ./initialize.py:/a0/initialize.py
      - ./preload.py:/a0/preload.py
      - ./prepare.py:/a0/prepare.py
      - ./lib:/a0/lib
      
      # Optional: Map .env file for API keys persistence
      # - ./agent-zero-data/.env:/a0/.env
    
    # Environment variables (optional)
    environment:
      - TZ=UTC
      # Enable AG-UI endpoints (SSE/WebSocket)
      - AGUI_ENABLED=true
      # CORS configuration for external frontend
      # Format: "https://app.vercel.app,https://yourdomain.com"
      # In development, localhost origins are auto-allowed, so this is optional
      # - CORS_ALLOWED_ORIGINS=https://app.vercel.app
      # Add custom env vars here if needed
      # - WEB_UI_PORT=80
      # - AUTH_LOGIN=admin
      # - AUTH_PASSWORD=changeme
    
    # Restart policy
    restart: unless-stopped
    
    networks:
      - agent-zero-network
    
    # Resource limits (optional, adjust as needed)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 8G
    #     reservations:
    #       cpus: '2'
    #       memory: 4G
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Network for service communication
networks:
  agent-zero-network:
    driver: bridge



