<html>
<head>
  <script type="module">
    import { store } from "/components/sidebar/sidebar-store.js";
  </script>
</head>
<body>
  <div x-data>
    <template x-if="$store.sidebar">
      <div class="sidebar-top-wrapper">
        <!-- Header Icons (Toggle + Logo) -->
        <x-component path="sidebar/top-section/header-icons.html"></x-component>
        
        <!-- Profile Switcher (Argent custom feature) -->
        <div class="profile-switcher-container" x-data="{ loaded: false }" x-init="
    if (!loaded) {
        loadHtmlComponent('/components/profiles/profile-switcher.html', $el).then(() => { loaded = true; });
    }
"></div>
        
        <!-- Quick Actions Buttons -->
        <x-component path="sidebar/top-section/quick-actions.html"></x-component>
      </div>
    </template>
  </div>


  <style>
    /* Sidebar top wrapper - ensures proper spacing and layout */
    .sidebar-top-wrapper {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
  </style>
</body>
</html>
