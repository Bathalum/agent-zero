<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AG-UI Vanilla JS Chat Example</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 800px;
      margin: 0 auto;
      border: 1px solid #ddd;
    }
    
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid #ddd;
      background: #f5f5f5;
    }
    
    .chat-header h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    
    .status {
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.875rem;
    }
    
    .status.connected {
      background: #4caf50;
      color: white;
    }
    
    .status.disconnected {
      background: #f44336;
      color: white;
    }
    
    .error-banner {
      padding: 0.75rem;
      background: #ffebee;
      color: #c62828;
      border-bottom: 1px solid #ddd;
      display: none;
    }
    
    .error-banner.show {
      display: block;
    }
    
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }
    
    .agui-message {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-radius: 4px;
    }
    
    .agui-message-message {
      background: #e3f2fd;
      margin-left: 20%;
    }
    
    .agui-message-response {
      background: #f1f8e9;
      margin-right: 20%;
    }
    
    .agui-message-error {
      background: #ffebee;
      color: #c62828;
    }
    
    .agui-message-content {
      margin-bottom: 0.25rem;
    }
    
    .agui-message-time {
      font-size: 0.75rem;
      color: #666;
    }
    
    .input-form {
      display: flex;
      padding: 1rem;
      border-top: 1px solid #ddd;
    }
    
    .input-form input {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-right: 0.5rem;
    }
    
    .input-form button {
      padding: 0.75rem 1.5rem;
      background: #2196f3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .input-form button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>AG-UI Vanilla JS Chat</h1>
      <div id="status" class="status disconnected">Disconnected</div>
    </div>
    
    <div id="error-banner" class="error-banner"></div>
    
    <div id="messages" class="messages"></div>
    
    <form id="input-form" class="input-form">
      <input
        id="message-input"
        type="text"
        placeholder="Type a message..."
        disabled
      />
      <button type="submit" disabled>Send</button>
    </form>
  </div>
  
  <script type="module">
    import { createChatInterface } from '../../agui-client/src/adapters/vanilla.js';
    
    const contextId = new URLSearchParams(window.location.search).get('context_id') || 'default';
    
    const chat = createChatInterface({
      url: 'http://localhost:50080',
      contextId,
      messageContainer: document.getElementById('messages'),
      inputElement: document.getElementById('message-input'),
      sendButton: document.querySelector('#input-form button'),
      statusElement: document.getElementById('status')
    });
    
    // Update button state based on connection
    chat.client.on('connected', () => {
      document.getElementById('message-input').disabled = false;
      document.querySelector('#input-form button').disabled = false;
    });
    
    chat.client.on('disconnected', () => {
      document.getElementById('message-input').disabled = true;
      document.querySelector('#input-form button').disabled = true;
    });
    
    chat.client.on('error', (error) => {
      const banner = document.getElementById('error-banner');
      banner.textContent = `Error: ${error.message}`;
      banner.classList.add('show');
    });
  </script>
</body>
</html>
